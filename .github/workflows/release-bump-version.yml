name: Release - Actualizar versión

on:
  push:
    branches:
      - 'release/v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  bump-version:
    name: Actualizar versión en pom.xml
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extraer versión del nombre de rama
        id: version
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          VERSION="${BRANCH#release/v}"
          VERSION="${VERSION//_/.}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Actualizar versión en pom.xml
        working-directory: backend
        run: mvn --no-transfer-progress versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/pom.xml
          git diff --cached --quiet || git commit -m "chore: actualizar versión a ${{ steps.version.outputs.version }}"
          git push
