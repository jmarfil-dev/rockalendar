services:
  postgres:
    image: postgres:16
    container_name: rockalendar-postgres
    environment:
      POSTGRES_DB: rockalendar
      POSTGRES_USER: rockalendar
      POSTGRES_PASSWORD: rockalendar
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-ES"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockalendar -d rockalendar"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: