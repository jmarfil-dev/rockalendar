services:
  postgres:
    image: postgres:16
    container_name: rockalendar-postgres
    environment:
      POSTGRES_DB: rockalendar
      POSTGRES_USER: rockalendar
      POSTGRES_PASSWORD: rockalendar
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-ES"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockalendar -d rockalendar"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: rockalendar-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # UI web → http://localhost:8025

  minio:
    image: minio/minio:latest
    container_name: rockalendar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rockalendar
      MINIO_ROOT_PASSWORD: rockalendar
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # Consola web → http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Crea el bucket al arrancar y sale
  minio-init:
    image: minio/mc:latest
    container_name: rockalendar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 rockalendar rockalendar &&
        mc mb --ignore-existing local/rockalendar &&
        mc anonymous set download local/rockalendar
      "

volumes:
  pgdata:
  miniodata: