# =================================
# PRODUCTION
# =================================

spring:
  application:
    name: rockalendar

# =================================
# MULTIPART
# Tomcat rechaza peticiones que superen este límite con MaxUploadSizeExceededException,
# capturada en GlobalExceptionHandler como 422 con mensaje descriptivo.
# =================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
# =================================
# MAIL (Brevo SMTP)
# =================================
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: "${BREVO_SMTP_USER}"
    password: "${BREVO_SMTP_PASSWORD}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# =================================
# JPA / HIBERNATE
# =================================
  jpa:
    hibernate:
      ddl-auto: validate # Flyway manda
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

# =================================
# FLYWAY
# =================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

# =================================
# SERIALIZERS
# ================================
  jackson:
    time-zone: UTC
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

# =================================
# ERRORS
# ================================
server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  forward-headers-strategy: framework  # o NATIVE
  tomcat:
    remoteip:
      trusted-proxies: "${IP_PROXY}" # IP del proxy/load balancer

# =================================
# DOCUMENTATION
# =================================
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# =================================
# SECURITY
# =================================
security:
  jwt:
    secret: "${JWT_SECRET:?JWT_SECRET environment variable must be set}"
    issuer: "rockalendar"
    ttl-minutes: 2880
  cookie:
    secure: true

# =================================
# LOGGING
# =================================
logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: info

# =================================
# PROPERTIES
# =================================
rockalendar:
  frontend:
    base-url: "${FRONTEND_BASE_URL}"
  email:
    from: "${EMAIL_FROM}"
  search:
    public:
      minSimilarity: 0.30
      ftsWeight: 2.0
      trgmWeight: 1.0
  storage:
    endpoint: "${STORAGE_ENDPOINT}"
    bucket: "${STORAGE_BUCKET}"
    access-key: "${STORAGE_ACCESS_KEY}"
    secret-key: "${STORAGE_SECRET_KEY}"
    public-url-base: "${STORAGE_PUBLIC_URL_BASE}"
