spring:
  jpa:
    show-sql: true

  flyway:
    locations: classpath:db/migration,classpath:db/migration-dev
    outOfOrder: true # Para migrar las versiones 1.x.x.x aunque ya estén migradas las 99.x.x.x

  jackson:
    time-zone: UTC
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  jwt:
    secret: "dev-secret-change-me-please-dev-secret-change-me"

logging:
  level:
    org.hibernate.SQL: debug