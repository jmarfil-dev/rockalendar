spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      max-lifetime: 240000     # 4 min
      keepalive-time: 60000    # 1 min
      validation-timeout: 5000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate # Flyway manda
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-test

security:
  jwt:
    secret: "dev-secret-change-me-please-dev-secret-change-me" # Necesario secret de 256 bits

rockalendar:
  frontend:
    base-url: "http://localhost:3000"
  email:
    from: "noreply@rockalendar.test"
  storage:
    endpoint: "http://localhost:9000"
    bucket: "rockalendar-test"
    access-key: "test"
    secret-key: "test-secret"
    public-url-base: "http://localhost:9000/rockalendar-test"

logging:
  level:
    org.hibernate.SQL: debug
